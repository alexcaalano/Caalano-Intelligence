<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239b8cff'/%3E%3Cstop offset='0.5' stop-color='%236d5efc'/%3E%3Cstop offset='1' stop-color='%2312b886'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='64' font-size='38' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E360%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Deep-link URLs carry a client id (?c=). Send only the origin (no path/query)
         to external hosts so ad-thumbnail / embed requests never leak client ids. -->
    <meta name="referrer" content="strict-origin" />
    <meta name="theme-color" content="#f4f5f8" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Caalano360 · Reporting</title>
    <!-- Apply the saved theme (default LIGHT) before the bundle loads so there's
         no flash of the dark palette on first paint. -->
    <script>
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('caalano_theme') || 'light') }
      catch (e) { document.documentElement.setAttribute('data-theme', 'light') }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
