[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the whole dashboard out of search engines — it's a private client
# reporting tool. Belt-and-braces alongside robots.txt + the noindex meta tag.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    # Clickjacking: don't allow the dashboard to be framed by other origins.
    X-Frame-Options = "SAMEORIGIN"
    # Stop MIME-sniffing responses into executable types.
    X-Content-Type-Options = "nosniff"
    # Send only the origin (never the path/query, which carries ?c=<clientId>) to
    # other sites - so ad-thumbnail / embed requests can't leak client ids.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS for two years (Netlify already serves HTTPS).
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # This tool uses none of these device APIs - deny them outright.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    # Content-Security-Policy - now ENFORCING. Validated in report-only first: a full
    # app tour (Meta embeds, maps, drill-downs, PDF export) produced zero CSP
    # violations in the console, so this matches what the app actually loads
    # (self-hosted bundle, inline styles, https ad thumbnails, OSM map tiles,
    # Instagram embeds). To roll back instantly, append "-Report-Only" to the header
    # name below so it logs instead of blocks.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' https://www.instagram.com https://instagram.com https://docs.google.com"

# Always revalidate the HTML so a new deploy's hashed bundle is picked up
# immediately; the hashed assets themselves can cache forever.
[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Function routes are served under /.netlify/functions/* and are not affected
# by this SPA fallback (Netlify resolves functions before redirects).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
